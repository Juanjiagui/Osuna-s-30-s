<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Osuna’s 30’s</title>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,500&display=swap">
<style>
/* Layout: pantalla negra con el título tipográfico 30’s y una hoja blanca que sube desde abajo con la rejilla de fotos. Al tocar una foto se abre el detalle a pantalla completa con el botón Descargar. */
:root {
  --ink: #000000;
  --paper: #ffffff;
  --tile: #d9d9d9;
  --mute: #939393;
  --hair: rgba(0, 0, 0, 0.1);
  --serif: "Newsreader", "PP Kyoto", Georgia, "Times New Roman", serif;
  --u: calc(min(100vw, 520px) / 375);
  --inset: env(safe-area-inset-top, 0px);
  color-scheme: light;
}

* { box-sizing: border-box; }

html { background: var(--ink); }

body {
  margin: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--serif);
  font-weight: 300;
  font-optical-sizing: auto;
  display: flex;
  flex-direction: column;
  min-height: calc(100dvh - var(--inset) - env(safe-area-inset-bottom, 0px));
}

body.locked { overflow: hidden; }

button, a { font: inherit; }

:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

/* ---------- Portada ---------- */
.hero {
  position: relative;
  height: calc(var(--inset) + 644 * var(--u));
  margin-top: calc(-1 * var(--inset));
  background: var(--ink);
  color: var(--paper);
  overflow: hidden;
  flex: none;
}

.title {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(var(--inset) + 172 * var(--u));
  margin: 0;
  display: flex;
  justify-content: center;
}

.title svg {
  display: block;
  width: calc(264 * var(--u));
  height: auto;
  color: var(--paper);
}

.cap {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(var(--inset) + 576 * var(--u));
  margin: 0;
  text-align: center;
  font-size: calc(16 * var(--u));
  line-height: 1.2;
}

/* ---------- Hoja de fotos ---------- */
.sheet {
  position: relative;
  flex: 1;
  background: var(--paper);
  color: var(--ink);
  border-radius: 24px 24px 0 0;
}

.sheet::before {
  content: "";
  position: absolute;
  top: 16px;
  left: 50%;
  width: 43px;
  height: 5px;
  margin-left: -21.5px;
  border-radius: 100px;
  background: var(--hair);
}

.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 38px 32px;
}

.grid {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

@media (min-width: 640px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

.tile {
  display: block;
  width: 100%;
  aspect-ratio: 162 / 117;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: var(--tile);
  color: var(--mute);
  font-weight: 500;
  font-size: 16px;
  cursor: pointer;
  overflow: hidden;
  position: relative;
}

.tile img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.tile:hover img { opacity: 0.92; }

/* ---------- Detalle ---------- */
.viewer {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: var(--ink);
  color: var(--paper);
  overflow-y: auto;
}

.close {
  position: absolute;
  top: calc(12px + var(--inset));
  right: max(12px, env(safe-area-inset-right, 0px));
  width: 44px;
  height: 44px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--paper);
  cursor: pointer;
}

.close svg { width: 20px; height: 20px; }

.stage {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 31px;
  padding-top: calc(72px + var(--inset));
  padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
  padding-left: max(25px, env(safe-area-inset-left, 0px));
  padding-right: max(25px, env(safe-area-inset-right, 0px));
}

.photo {
  width: min(100%, 560px);
  min-width: 0;
}

.photo .ph {
  aspect-ratio: 322 / 233;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: var(--tile);
  color: var(--mute);
  font-weight: 500;
  font-size: 16px;
}

.photo img {
  display: block;
  width: 100%;
  max-height: 62dvh;
  object-fit: contain;
  border-radius: 8px;
}

.dl {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: min(100%, 322px);
  height: 56px;
  border-radius: 1000px;
  background: var(--paper);
  color: var(--ink);
  font-weight: 500;
  font-size: 16px;
  text-decoration: none;
  cursor: pointer;
}

.dl svg {
  position: absolute;
  right: 30px;
  top: 50%;
  width: 20px;
  height: 20px;
  margin-top: -10px;
}

.dl[aria-disabled="true"] { opacity: 0.45; cursor: default; }

.status {
  margin: -15px 0 0;
  min-height: 1.3em;
  font-size: 14px;
  color: var(--mute);
  text-align: center;
}

@media (prefers-reduced-motion: no-preference) {
  .tile img { transition: opacity 0.15s ease; }
}

/* ---------- Contraseña ---------- */
.lock {
  display: grid;
  gap: 12px;
  max-width: 420px;
  margin: 0 auto;
  padding-top: 8px;
}

.lock label {
  font-weight: 500;
  font-size: 16px;
  color: var(--mute);
}

.lock input {
  width: 100%;
  height: 56px;
  padding: 0 20px;
  border: 0;
  border-radius: 8px;
  background: var(--tile);
  color: var(--ink);
  font: 500 18px var(--serif);
}

.lock input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.lock button {
  height: 56px;
  border: 0;
  border-radius: 1000px;
  background: var(--ink);
  color: var(--paper);
  font: 500 16px var(--serif);
  cursor: pointer;
}

.lock button:disabled { opacity: 0.5; cursor: default; }

.lock .msg {
  margin: 0;
  min-height: 1.3em;
  font-size: 14px;
  color: var(--mute);
}

.lock .msg.err { color: #b3261e; }

/* ---------- Pantalla previa ---------- */
.gate {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  overflow-y: auto;
  background: var(--ink);
  color: var(--paper);
  padding-top: calc(24px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}

.gate .lock {
  width: min(100%, 360px);
  max-width: none;
  margin: 0;
  padding: 0;
}

.gate-title {
  margin: 0 0 20px;
  text-align: center;
  font-weight: 300;
  font-size: 40px;
  line-height: 1.1;
  letter-spacing: -0.01em;
}

.gate .lock label { color: var(--mute); }

.gate .lock input {
  background: #1b1b1b;
  color: var(--paper);
}

.gate .lock input:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

.gate .lock button {
  background: var(--paper);
  color: var(--ink);
}

.gate .lock .msg.err { color: #ff9b91; }
</style>
</head>

    <button type="submit" id="enter">Entrar</button>
    <p class="msg" id="lockmsg" role="status" aria-live="polite"></p>

</div>

(function () {
  var PHOTOS = CONFIG.photos;
  var grid = document.getElementById("grid");
  var lockForm = document.getElementById("lock");
  var pwInput = document.getElementById("pw");
  var enterBtn = document.getElementById("enter");
  var lockMsg = document.getElementById("lockmsg");
  var viewer = document.getElementById("viewer");
  var photoBox = document.getElementById("photo");
  var dlBtn = document.getElementById("dl");
  var statusEl = document.getElementById("status");
  var closeBtn = document.getElementById("close");
  var key = null;
  var current = -1;
  var opener = null;
  var blobCache = {};
  var urlCache = {};
  var queue = [];
  var active = 0;

  function b64(s) {
    var bin = atob(s);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function deriveKey(pw) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (km) {
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(CONFIG.salt), iterations: CONFIG.iter, hash: "SHA-256" },
        km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
    });
  }

  function getBlob(p) {
    if (!blobCache[p.id]) {
      blobCache[p.id] = fetch(p.id).then(function (r) {
        if (!r.ok) throw new Error("fetch");
        return r.text();
      }).then(function (t) {
        var d = b64(t.trim());
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: d.slice(0, 12) }, key, d.slice(12));
      }).then(function (buf) {
        return new Blob([buf], { type: "image/jpeg" });
      });
      blobCache[p.id].catch(function () { delete blobCache[p.id]; });
    }
    return blobCache[p.id];
  }

  function getUrl(p) {
    if (!urlCache[p.id]) {
      urlCache[p.id] = getBlob(p).then(function (b) { return URL.createObjectURL(b); });
      urlCache[p.id].catch(function () { delete urlCache[p.id]; });
    }
    return urlCache[p.id];
  }

  function pump() {
    while (active < 4 && queue.length) {
      var job = queue.shift();
      active++;
      job().then(done, done);
    }
    function done() { active--; pump(); }
  }

  var observer = null;
  function loadTile(btn, i) {
    queue.push(function () {
      return getUrl(PHOTOS[i]).then(function (url) {
        var img = document.createElement("img");
        img.alt = "Foto " + (i + 1);
        img.decoding = "async";
        img.src = url;
        btn.textContent = "";
        btn.appendChild(img);
      }, function () { btn.textContent = "Foto"; });
    });
    pump();
  }

  function renderGrid() {
    grid.textContent = "";
    if ("IntersectionObserver" in window) {
      observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) {
            observer.unobserve(en.target);
            loadTile(en.target, Number(en.target.getAttribute("data-i")));
          }
        });
      }, { rootMargin: "400px 0px" });
    }
    PHOTOS.forEach(function (p, i) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tile";
      b.setAttribute("data-i", String(i));
      b.setAttribute("aria-label", "Abrir foto " + (i + 1));
      b.addEventListener("click", function () { openViewer(i, b); });
      li.appendChild(b);
      grid.appendChild(li);
      if (observer) observer.observe(b); else loadTile(b, i);
    });
  }

  function setStatus(t) { statusEl.textContent = t || ""; }

  function openViewer(i, from) {
    current = i;
    opener = from || null;
    var p = PHOTOS[i];
    photoBox.textContent = "";
    setStatus("");
    var ph = document.createElement("div");
    ph.className = "ph";
    ph.textContent = "Foto";
    photoBox.appendChild(ph);
    dlBtn.removeAttribute("href");
    dlBtn.removeAttribute("target");
    dlBtn.setAttribute("aria-disabled", "true");
    viewer.hidden = false;
    document.body.classList.add("locked");
    viewer.scrollTop = 0;
    closeBtn.focus();
    getUrl(p).then(function (url) {
      if (current !== i) return;
      var img = document.createElement("img");
      img.alt = "Foto " + (i + 1);
      img.src = url;
      photoBox.textContent = "";
      photoBox.appendChild(img);
      dlBtn.removeAttribute("aria-disabled");
      dlBtn.href = url;
      dlBtn.setAttribute("download", p.file);
    }, function () {
      if (current !== i) return;
      setStatus("No se ha podido cargar la foto. Vuelve a intentarlo.");
    });
  }

  function closeViewer() {
    viewer.hidden = true;
    document.body.classList.remove("locked");
    current = -1;
    if (opener) opener.focus();
  }

  function step(d) {
    if (current < 0 || PHOTOS.length < 2) return;
    openViewer((current + d + PHOTOS.length) % PHOTOS.length, opener);
  }

  dlBtn.addEventListener("click", function (e) {
    if (dlBtn.getAttribute("aria-disabled") === "true" || !dlBtn.getAttribute("href")) { e.preventDefault(); }
  });

  closeBtn.addEventListener("click", closeViewer);

  document.addEventListener("keydown", function (e) {
    if (viewer.hidden) return;
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
  });

  lockForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = pwInput.value;
    if (!pw) return;
    if (!window.crypto || !window.crypto.subtle) {
      lockMsg.className = "msg err";
      lockMsg.textContent = "Este navegador no puede abrir las fotos. Prueba con uno actualizado.";
      return;
    }
    lockMsg.className = "msg";
    lockMsg.textContent = "Comprobando…";
    enterBtn.disabled = true;
    deriveKey(pw).then(function (k) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(CONFIG.v.iv) }, k, b64(CONFIG.v.ct)).then(function () {
        key = k;
      });
    }).then(function () {
      pwInput.value = "";
      document.getElementById("gate").hidden = true;
      document.getElementById("hero").hidden = false;
      document.getElementById("sheet").hidden = false;
      grid.hidden = false;
      renderGrid();
      window.scrollTo(0, 0);
    }, function () {
      lockMsg.className = "msg err";
      lockMsg.textContent = "Contraseña incorrecta";
      enterBtn.disabled = false;
      pwInput.focus();
      pwInput.select();
    });
  });
})();
